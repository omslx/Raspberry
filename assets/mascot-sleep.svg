 .led{animation:ld 1.2s infinite}.l1{animation-delay:.3s}.l2{animation-delay:.7s}
 @keyframes ld{0%,100%{opacity:1}50%{opacity:.15}}
 .spark{animation:sp 1.6s ease-in-out infinite}@keyframes sp{0%,100%{opacity:.35}50%{opacity:1}}
 .zzz{animation:zz 2.6s ease-in-out infinite}@keyframes zz{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-8px);opacity:1}}
 .bob{animation:bob 2.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
